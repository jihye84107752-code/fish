<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Dolphin Aquarium - Slow Motion</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: url('배경화면쓰자.png') no-repeat center center fixed;
            background-size: cover;
        }

        .ocean {
            position: relative;
            width: 100%;
            height: 100%;
            perspective: 1000px;
        }

        .whale-container {
            position: absolute;
            top: 50%;
            left: 0;
            width: fit-content;
            transform-style: preserve-3d;
            /* 👇 속도를 12s에서 25s로 변경 (숫자가 커질수록 느려집니다) */
            animation: swim 25s ease-in-out infinite;
            will-change: transform;
        }

        .whale-container img {
            width: 20vw;
            max-width: 350px;
            min-width: 150px;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.3));
            transform: rotateY(-10deg);
        }

        @keyframes swim {
            0% {
                transform: translateY(-50%) translateX(-25vw) scaleX(1);
            }
            45% {
                transform: translateY(-55%) translateX(85vw) scaleX(1);
            }
            /* 방향 전환할 때 멈칫하는 느낌을 줄이기 위해 구간을 짧게 설정 */
            50% {
                transform: translateY(-55%) translateX(85vw) scaleX(-1);
            }
            95% {
                transform: translateY(-50%) translateX(-25vw) scaleX(-1);
            }
            100% {
                transform: translateY(-50%) translateX(-25vw) scaleX(1);
            }
        }

        .bubble {
            position: absolute;
            bottom: -50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            border: 0.5px solid rgba(255, 255, 255, 0.2);
            animation: rise linear forwards;
            pointer-events: none;
        }

        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="ocean">
    <div class="whale-container">
        <img src="쓰리디 돌고래.png" alt="dolphin">
    </div>
</div>

<script>
    function createBubble() {
        const ocean = document.querySelector('.ocean');
        const bubble = document.createElement('div');
        const size = Math.random() * 15 + 5;

        bubble.classList.add('bubble');
        bubble.style.width = size + "px";
        bubble.style.height = size + "px";
        bubble.style.left = Math.random() * 100 + "vw";
        bubble.style.animationDuration = (Math.random() * 4 + 6) + "s";

        ocean.appendChild(bubble);
        setTimeout(() => bubble.remove(), 10000);
    }

    setInterval(createBubble, 600);
</script>

</body>
</html>
